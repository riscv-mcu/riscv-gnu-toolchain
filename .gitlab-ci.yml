variables:
  SHARELOC: /home/share/devtools/toolchain/nuclei_gnu
  # https://docs.gitlab.com/ee/ci/runners/configure_runners.html#git-strategy
  # fetch strategy will met a lot of strange issues when using with submodule such as
  # fatal: not a git repository: dejagnu/../.git/modules/dejagnu
  # so just do a fresh clone without update submodule
  GIT_STRATEGY: clone
  # don't clone submodule
  GIT_SUBMODULE_STRATEGY: none
  # clone depth set to a small number
  GIT_DEPTH: "3"
  IMGSVR: rego.corp.nucleisys.com/software
  # centos 6 is EOL, use centos 7
  LINBUILDIMG: "gnutoolchain-centos7"
  WINBUILDIMG: "gnutoolchain-ubuntu20.04"
  # image used by testsuite jobs (gcc newlib report)
  TESTIMG: "gnutoolchain-test"
  TESTIMGTAG: "latest"
  IMGTAG: "v2"
  JOBS: 32

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /draft|wip|stash/i
      when: never
    - if: $CI_COMMIT_BRANCH =~ /nuclei|feature/
    - if: $CI_COMMIT_TAG =~ /nuclei-/
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /nuclei|feature/ && $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - prepare
  - test
  - build
  - deploy

prepare_source:
  stage: prepare
  interruptible: true
  # https://docs.gitlab.com/ee/ci/yaml/#timeout
  # clone takes about 10min, upload artifacts need more time
  timeout: 60m
  retry:
    max: 2
    when:
      # ERROR: Job failed (system failure): Cannot connect to the Docker daemon at unix:///var/run/docker.sock. Is the docker daemon running? (docker.go:534:120s)
      # https://docs.gitlab.com/ee/ci/yaml/#retrywhen
      - runner_system_failure
  image: $IMGSVR/$LINBUILDIMG:$IMGTAG
  variables:
    # develop branch is used to track latest working version
    # master branch is used to track latest release version
    libncrtbranch: master
  script:
    - free -g
    - command -v ssh-agent >/dev/null
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # ssh-add - doesn't work in centos6. error with No such file or directory
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # important: need to avoid git ssh asking yes/no when clone
    # https://serverfault.com/questions/469052/ssh-failing-from-script-working-on-command-line-git
    - ssh-keyscan gito > ~/.ssh/known_hosts
    - ssh-keyscan gito.corp.nucleisys.com >> ~/.ssh/known_hosts
    - pwd
    - git remote -v
    - echo $CI_REPOSITORY_URL
    - git remote set-url origin git@gito.corp.nucleisys.com:software/devtools/riscv-gnu-toolchain.git
    # https://stackoverflow.com/questions/6842687/the-remote-end-hung-up-unexpectedly-while-git-cloning
    - git config --global http.postBuffer 256M
    - git config --global http.maxRequestBuffer 256M
    # sync url using ssh url, clean repo and its submodule
    - git submodule init || true
    - git submodule sync || true
    - git submodule || true
    - git clean -fdx
    - git submodule foreach --recursive git clean -xfdf || true
    - git reset --hard || true
    # enable git trace
    #- export GIT_TRACE=1
    # reset repo and its submodule repo
    #- git reset --hard --recurse-submodules || true
    # prepare toolchain source code
    - FORCE_SUBMODULE=1 CLONE_DEPTH=1 ./scripts/toolchain/prepsrc.sh ${libncrtbranch}
    # Download gcc prerequisites
    - |
        cd gcc
        downscript=contrib/download_prerequisites
        if [ ! -f $downscript ] ; then
            echo "ERROR: gcc repo maybe not complete!"
            exit 1
        fi
        echo "INFO: Download gcc prerequisites..."
        ./$downscript
        cd ..
    - echo "INFO Creating single high-compression source archive (including .git) to speed up CI..."
    - tar -Jcf /tmp/toolchain_source.tar.xz . && mv /tmp/toolchain_source.tar.xz .
    - ls -lh toolchain_source.tar.xz
  artifacts:
    name: "rvtoolchain_source-${CI_COMMIT_SHA::8}"
    paths:
      - toolchain_source.tar.xz
  tags:
    - env::docker
    - build::toolchain
    - host::whss4

## Job template
.build_job_template: &build_job_template_default
  stage: build
  timeout: 10h
  interruptible: true
  # https://docs.gitlab.com/ee/ci/yaml/index.html#retrywhen
  retry:
    max: 2
    when:
      # ERROR: Job failed (system failure): Cannot connect to the Docker daemon at unix:///var/run/docker.sock. Is the docker daemon running? (docker.go:534:120s)
      - runner_system_failure
  needs:
    - job: prepare_source
      artifacts: true
    # gate build on testsuite success: build only runs if tests passed
    - job: test_toolchain_report
      artifacts: false
  variables:
    GIT_STRATEGY: none
  artifacts:
    name: "${CI_JOB_NAME}-${citooltype}_${CI_COMMIT_SHA::8}"
    when: always
    paths:
      - "*.log"
      - "*.env"
      - cigen
      - logs
  before_script:
    - echo "INFO Extracting source archive..."
    - tar -Jxf toolchain_source.tar.xz && rm -f toolchain_source.tar.xz
    # check toolchain repo status
    - |
        echo "INFO: Show current repo status"
        git status --ignored=matching || true
        git submodule || true
        # show also untracked files
        git submodule foreach git status --ignored=matching || true
        # force reset repo and its submodule source code
        echo "INFO: Hard reset repo and its submodule source code"
        git reset --hard || true
        git submodule foreach git reset --hard || true
        # remove glibc/newlibc untracked files
        for cddir in newlib glibc; do git -C $cddir clean -fdx ; done || true
        echo "INFO: Show repo status after reset"
        git status || true
        git submodule || true
        echo "INFO: toolchain repo is ready!"
    # check libncrt repo status
    - |
        if [ ! -d libncrt ] ; then
            echo "ERROR: libncrt repo doesn't exist, exit now!"
            exit 1
        fi
        pushd libncrt
        git reset --hard || true
        git submodule foreach git reset --hard || true
        git submodule || true
        popd
        echo "INFO: libncrt repo is ready!"
    # set the toolver to branch name or tag name, see https://docs.gitlab.com/ee/ci/variables/predefined_variables.html
    - if [ ${CI_COMMIT_TAG} ] ; then export citoolver=${CI_COMMIT_TAG/nuclei-/} ; else export citoolver=${CI_COMMIT_REF_SLUG}${CI_MERGE_REQUEST_PROJECT_ID} ; fi
    - echo "Build for toolchain version $citoolver, toolchain type $citooltype"
    - rm -rf logs cigen
    - mkdir -p cigen
    - export CIARCLOC=$(pwd)/cigen
    - echo "CI Artifacts will be generated into $CIARCLOC"
  tags:
    - env::docker
    - build::toolchain
    - host::whss4

## Job for build linux host toolchain
build_linux:
  <<: *build_job_template_default
  image: $IMGSVR/$LINBUILDIMG:$IMGTAG
  parallel:
    matrix:
      - citooltype: ["newlibc", "glibc"]
  script:
    # Check build environment
    # source scl environment https://listman.redhat.com/archives/sclorg/2020-October/msg00000.html
    # enable following scl toolsets for centos7
    - source scl_source enable devtoolset-9 rh-python38 || true
    # docker runner is non-interactive, non-logina
    # https://gitlab.com/gitlab-org/gitlab-runner/-/issues/82
    # prepare rake and ruby environment
    - eval "$(/root/.rbenv/bin/rbenv init - --no-rehash bash)"
    - echo $PATH && cat /etc/os-release
    - whoami && which gcc python3 rake
    - gcc --version && python3 --version && rake --version
    # copy the template
    - cp -f scripts/toolchain/buildenv.sample build.env
    - BUILDENV=build.env source scripts/toolchain/setup_env.sh
    - export TOOLVER=${citoolver}
    - export TOOLTYPE=${citooltype}
    - export TOOLHOST=linux64
    # clean existing toolchain install prefix directory
    - export DOCLEANPREFIX=1
    - ./scripts/toolchain/save_env.sh build.env
    - ./scripts/toolchain/build.sh 2>&1 | tee build.log
    - buildsts=${PIPESTATUS[0]}
    - exit $buildsts

## Job for build windows host toolchain
build_windows:
  <<: *build_job_template_default
  image: $IMGSVR/$WINBUILDIMG:$IMGTAG
  when: manual
  needs:
    - job: build_linux
      artifacts: false
    - job: prepare_source
      artifacts: true
  parallel:
    matrix:
      - citooltype: ["newlibc", "glibc"]
        citoolhost: ["win32",  "win64"]
  script:
    # Check build environment
    - echo $PATH && cat /etc/os-release
    - whoami && which gcc python3 rake
    - |
        wingcc=i686-w64-mingw32-gcc
        if [ "x${citoolhost}" == "xwin64" ] ; then
           wingcc=x86_64-w64-mingw32-gcc
        fi
        echo "Check $wingcc version"
        ${wingcc} --version
    - gcc --version && python3 --version && rake --version
    # copy the template
    - cp -f scripts/toolchain/buildenv.sample build.env
    - BUILDENV=build.env source scripts/toolchain/setup_env.sh
    - export TOOLVER=${citoolver}
    - export TOOLTYPE=${citooltype}
    - export TOOLHOST=${citoolhost}
    # clean existing toolchain install prefix directory
    - export DOCLEANPREFIX=1
    - ./scripts/toolchain/save_env.sh build.env
    - ./scripts/toolchain/build.sh 2>&1 | tee build.log
    - buildsts=${PIPESTATUS[0]}
    - exit $buildsts

## Job for testsuite (gcc + binutils report) on rv32gc/rv64gc
# Build gcc/sim/dejagnu once, then run both gcc (report-newlib) and binutils
# (report-binutils) testsuites. Upload all results as artifacts (always, even
# on failure), and gate build/deploy on success.
test_toolchain_report:
  stage: test
  image: $IMGSVR/$TESTIMG:$TESTIMGTAG
  timeout: 2h
  interruptible: true
  retry:
    max: 2
    when:
      # ERROR: Job failed (system failure): Cannot connect to the Docker daemon
      - runner_system_failure
  needs:
    - job: prepare_source
      artifacts: true
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - ciarch: rv32gc
        ciabi: ilp32d
      - ciarch: rv64gc
        ciabi: lp64d
      - ciarch: "rv32imafd_zca_zcb_zcf_zcmp_zcmt_zba_zbb_zbc_zbs_zicond_zilsd_zk_zks_xxldspn3x"
        ciabi: ilp32d
      - ciarch: "rv64imafd_zca_zcb_zcmp_zcmt_zba_zbb_zbc_zbs_zicond_zk_zks_xxldsp"
        ciabi: lp64d
  script:
    # extract the source archive produced by prepare_source
    - echo "INFO Extracting source archive..."
    - tar -Jxf toolchain_source.tar.xz && rm -f toolchain_source.tar.xz
    # run the unified test script (build + gcc/binutils testsuite)
    # ARCH/ABI come from the matrix; JOBS from the global variable
    - ARCH=$ciarch ABI=$ciabi JOBS=$JOBS ./scripts/toolchain/test.sh 2>&1 | tee report-${CI_JOB_NAME_SLUG}.log
    - teststs=${PIPESTATUS[0]}
    - exit $teststs
  artifacts:
    name: "testsuite_${ciarch}_${ciabi}-${CI_COMMIT_SHA::8}"
    when: always
    paths:
      # gcc test results (always uploaded, even on failure)
      - build-gcc-newlib-stage2/gcc/testsuite/gcc/*.sum
      - build-gcc-newlib-stage2/gcc/testsuite/gcc/*.log
      - build-gcc-newlib-stage2/gcc/testsuite/g++/*.sum
      - build-gcc-newlib-stage2/gcc/testsuite/g++/*.log
      - build-gcc-newlib-stage2/gcc/testsuite/gfortran/*.sum
      - build-gcc-newlib-stage2/gcc/testsuite/gfortran/*.log
      - build-gcc-newlib-stage2/gcc/testsuite/*/gcc.sum.bak
      # binutils test results
      - build-binutils-newlib/ld/*.sum
      - build-binutils-newlib/ld/*.log
      - build-binutils-newlib/gas/*.sum
      - build-binutils-newlib/gas/*.log
      - build-binutils-newlib/binutils/*.sum
      - build-binutils-newlib/binutils/*.log
      # configure/build logs
      - report-newlib-*.log
      - report-binutils-*.log
      - build-gcc-*.log
      - build-sim-*.log
      - build-dejagnu-*.log
      - config.log
      - config.status
    expire_in: 1 week
  tags:
    - env::docker
    - build::toolchain
    - host::whss4

# clean up build directories and build installed toolchains
cleanbuild:
  # don't need full toolchain source code
  # still need to run in docker to clean builds, need root permission in docker
  image: $IMGSVR/ubuntu:20.04
  needs:
    - job: prepare_source
      artifacts: false
  parallel:
    matrix:
      - citooltype: ["newlibc", "glibc"]
        citoolhost: ["win32",  "win64", "linux64"]
  stage: build
  when: manual
  allow_failure: true
  script:
    - if [ ${CI_COMMIT_TAG} ] ; then export citoolver=${CI_COMMIT_TAG/nuclei-/} ; else export citoolver=${CI_COMMIT_REF_SLUG}${CI_MERGE_REQUEST_PROJECT_ID} ; fi
    - export TOOLVER=${citoolver}
    - export TOOLTYPE=${citooltype}
    - export TOOLHOST=${citoolhost}
    - CLEANINSTALL=1 ./scripts/toolchain/cleanup.sh
  tags:
    - env::docker
    - host::whss4

## Job for deploy document to internal server
release:
  stage: deploy
  # https://docs.gitlab.com/ee/ci/yaml/index.html#needsartifacts
  # don't need full toolchain source code
  needs:
    - job: prepare_source
      artifacts: false
    - job: build_linux
      artifacts: false
    # gate deploy on testsuite success: if the test job fails, release is skipped
    - job: test_toolchain_report
      artifacts: false
  when: on_success
  interruptible: true
  only:
      refs:
          - branches
          - tags
  parallel:
    matrix:
      - citooltype: ["newlibc", "glibc"]
  script:
    - if [ ${CI_COMMIT_TAG} ] ; then export citoolver=${CI_COMMIT_TAG/nuclei-/} ; else export citoolver=${CI_COMMIT_REF_SLUG}${CI_MERGE_REQUEST_PROJECT_ID} ; fi
    - export TOOLVER=${citoolver}
    - export TOOLTYPE=${citooltype}
    - export TOOLHOST=linux64
    - ./scripts/toolchain/release.sh
  tags:
    - env::shell
    - host::whss4
